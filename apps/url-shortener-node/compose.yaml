services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

# The prometheus/grafana pair that used to live here (ports 9090/3002, scraping
# this app's prom-client /metrics directly) is superseded by the monorepo stack
# in infra/observability/, which publishes on the 7xxx block. Until slice 3
# retires prom-client, its metrics are still readable at localhost:3001/metrics.
