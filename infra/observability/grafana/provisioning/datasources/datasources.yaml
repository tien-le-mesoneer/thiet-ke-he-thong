apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      # Exemplars link a latency-histogram spike straight to its trace.
      # The Tempo datasource this points at arrives in slice 2.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Click a slow span -> jump to the metrics for that service.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
      # Grafana's service graph, built from Tempo's span-derived metrics.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # Surface the slowest spans first -- the tail is the point.
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
