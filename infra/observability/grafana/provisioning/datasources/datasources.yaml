apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      # Exemplars link a latency-histogram spike straight to its trace.
      # The Tempo datasource this points at arrives in slice 2.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
