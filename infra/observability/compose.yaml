# Monorepo-wide observability stack.
#
# Services run on the HOST (npm run dev:otel) and export OTLP to the Collector
# on localhost:4318. Only the backends are containerised.
#
#   podman compose -f infra/observability/compose.yaml up -d
#
# Host ports live on the 7xxx block (see .env) so nothing collides with the
# usual 3000/9090/4317 defaults. Container-internal ports are unchanged --
# only the host side is remapped, so upstream configs keep their defaults.
#
# Slice 1: Collector + Prometheus + Grafana. Tempo lands in slice 2.

name: sd-observability

services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OBS_OTLP_GRPC_PORT:-7317}:4317"          # OTLP gRPC   (app -> collector)
      - "${OBS_OTLP_HTTP_PORT:-7318}:4318"          # OTLP HTTP   (app -> collector)
      - "${OBS_COLLECTOR_METRICS_PORT:-7889}:8889"  # app metrics (host debugging)
      - "${OBS_COLLECTOR_HEALTH_PORT:-7133}:13133"  # health
    # 8888 (collector self-metrics) stays unpublished on purpose -- Prometheus
    # reaches it inside this network. Query it through Prometheus, not curl.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Required for exemplars (metric spike -> trace) in slice 2.
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBS_PROMETHEUS_PORT:-7090}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    environment:
      # Local-only stack: skip the login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBS_GRAFANA_PORT:-7080}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
