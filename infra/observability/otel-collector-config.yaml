# OTel Collector — the single ingestion point for every Node service.
# Slice 1 scope: prove OTLP arrives. Traces go to the debug exporter (stdout);
# Tempo replaces that in slice 2. Metrics are already exposed for Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batching is what keeps telemetry export off the request path.
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # App metrics, re-exposed for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
    # resource_to_telemetry_conversion is deliberately OFF. Turning it on
    # copies EVERY resource attribute onto every series -- process_pid,
    # process_command_args, process_executable_path, host_id -- which is a
    # cardinality bomb: process_pid alone mints a fresh time series on every
    # restart, and the full argv is a multi-hundred-byte label. The exporter
    # already derives job= from service.name and instance= from
    # service.instance.id, which is the identity we actually need.
    resource_to_telemetry_conversion:
      enabled: false
  # Traces land in Tempo, which Grafana queries. Replaces the slice-1 debug
  # exporter -- printing spans to stdout proved they arrived but made them
  # impossible to search, which is exactly what a game-day needs.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true   # local compose network, no certs in play

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
    metrics:
      # Bind the Collector's own metrics to 0.0.0.0 so Prometheus (a different
      # container) can reach them; the default localhost bind is unreachable.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
