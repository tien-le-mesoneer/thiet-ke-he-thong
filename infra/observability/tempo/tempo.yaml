# Tempo, single-binary mode. Trace storage only — it has no query UI of its
# own; Grafana is the front end.
#
# Right-sized for a laptop: local disk, 24h retention. Traces here are for
# explaining a spike that happened minutes ago, not for long-term forensics.
# (Trigger for object storage + longer retention: needing to investigate an
# incident from last week.)

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush blocks quickly so a trace becomes searchable seconds after it ends,
  # rather than after the default multi-minute window. Matters a lot during a
  # game-day, where the whole point is following a spike while it is fresh.
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Derives RED metrics (rate/errors/duration) from spans and writes them to
# Prometheus, which also powers Grafana's service graph.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
