# Unit tests for rules.yml — run with:
#   promtool test rules rules_test.yml
#
# An alert that has never fired is not an alert, it is a wish. Waiting for a
# real incident to find out whether the expression works is the worst possible
# time to discover a typo, and deliberately melting the service to test it is
# both slow and unrepeatable. These drive synthetic series through the real
# rules instead.

rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # 20% of redirects slower than 50ms => 20x burn. Both the 1h and the 5m
  # window are over the 14.4x threshold, so critical must fire.
  # ------------------------------------------------------------------
  - interval: 1m
    name: sustained 20x burn fires the critical alert
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="302"}'
        values: '0+100x180'
      - series: 'http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}'
        values: '0+80x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: RedirectLatencyBudgetBurnCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: redirect-latency
            exp_annotations:
              summary: "Redirect latency budget burning 14.4x — 2% of the 30d budget per hour"
              description: "More than 14.4% of successful redirects are slower than 50 ms over the last hour, and still are over the last 5 minutes. At this rate the entire 30-day error budget is gone in about 2 days."

  # ------------------------------------------------------------------
  # Healthy traffic: 0.1% slow, a 0.1x burn. Nothing may fire — a burn-rate
  # alert that pages on normal noise gets muted, and a muted alert is worse
  # than none.
  # ------------------------------------------------------------------
  - interval: 1m
    name: healthy traffic fires nothing
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="302"}'
        values: '0+1000x180'
      - series: 'http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}'
        values: '0+999x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: RedirectLatencyBudgetBurnCritical
        exp_alerts: []
      - eval_time: 120m
        alertname: RedirectLatencyBudgetBurnHigh
        exp_alerts: []
      - eval_time: 120m
        alertname: RedirectLatencyBudgetBurnSlow
        exp_alerts: []

  # ------------------------------------------------------------------
  # 8x burn: above the 6x "high" threshold but below 14.4x. High fires,
  # critical stays quiet. This is the test that catches a copy-paste error
  # between the two alert expressions.
  # ------------------------------------------------------------------
  - interval: 1m
    name: 8x burn fires high but not critical
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="302"}'
        values: '0+100x600'
      - series: 'http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}'
        values: '0+92x600'
    alert_rule_test:
      - eval_time: 500m
        alertname: RedirectLatencyBudgetBurnCritical
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectLatencyBudgetBurnHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: redirect-latency
            exp_annotations:
              summary: "Redirect latency budget burning 6x — 5% of the 30d budget per 6h"
              description: "Slower than the critical alert but well above sustainable. Worth looking at during working hours rather than at 3am."

  # ------------------------------------------------------------------
  # No successful redirects at all. The latency SLI goes ABSENT rather than
  # bad, which is the blind spot a latency-only SLO always has. The guard
  # alert exists to make that visible instead of serenely green.
  # ------------------------------------------------------------------
  - interval: 1m
    name: absent SLI trips the guard alert
    input_series:
      - series: 'up{job="otel-collector-apps"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: RedirectLatencySLIMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: redirect-latency
            exp_annotations:
              summary: "Redirect latency SLI has no data — cannot tell healthy from dead"
              description: "No successful redirects recorded for 10 minutes. Either traffic stopped or every request is failing. A latency SLO cannot distinguish the two; check availability."

  # ==================================================================
  # AVAILABILITY SLO TESTS
  # ==================================================================

  # ------------------------------------------------------------------
  # THE GAME-DAY CASE. Every request 5xx: the thing that happened on
  # 2026-08-30 and that every existing alert slept through.
  #
  # The latency SLI goes absent (no 302s to be slow). The availability
  # SLI reads 100% error, because its denominator counts the failures
  # too. That difference is the entire reason this SLO exists, so it is
  # asserted in both directions in one test.
  # ------------------------------------------------------------------
  - interval: 1m
    name: total 5xx outage fires availability critical, not just the latency guard
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="500"}'
        values: '0+100x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: RedirectAvailabilityBudgetBurnCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: redirect-availability
            exp_annotations:
              summary: "Redirect availability burning 14.4x — 2% of the 30d budget per hour"
              description: "More than 1.44% of redirect requests are returning 5xx over the last hour, and still are over the last 5 minutes. The 30-day budget is 43.2 minutes; at this rate it is gone in about 2 days."
      # Traffic IS flowing — the silence guard must stay quiet and let the
      # burn alert own this case.
      - eval_time: 120m
        alertname: RedirectTrafficAbsent
        exp_alerts: []

  # ------------------------------------------------------------------
  # THE NEGATIVE THAT MATTERS MOST. A crawler walking random short codes
  # produces a 100% 404 rate. Those are CORRECT responses. If any
  # availability alert fires here the SLI is wrong, and the first real
  # bot sweep would burn a 43-minute budget in minutes.
  # ------------------------------------------------------------------
  - interval: 1m
    name: a storm of 404s burns no availability budget
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="404"}'
        values: '0+500x600'
    alert_rule_test:
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnCritical
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnHigh
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnSlow
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectTrafficAbsent
        exp_alerts: []

  # ------------------------------------------------------------------
  # Healthy service: 99.95% success, a 0.5x burn — inside budget.
  # Nothing may fire. Catches a threshold written with the latency
  # budget (0.01) instead of the availability one (0.001).
  # ------------------------------------------------------------------
  - interval: 1m
    name: healthy availability fires nothing
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="302"}'
        values: '0+2000x600'
      - series: 'http_request_duration_seconds_count{route="/:code",status="500"}'
        values: '0+1x600'
    alert_rule_test:
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnCritical
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnHigh
        exp_alerts: []

  # ------------------------------------------------------------------
  # 8x burn: above the 6x "high" threshold, below 14.4x. High fires,
  # critical stays quiet. The copy-paste check, mirroring the latency
  # test of the same shape.
  # ------------------------------------------------------------------
  - interval: 1m
    name: 8x availability burn fires high but not critical
    input_series:
      - series: 'http_request_duration_seconds_count{route="/:code",status="302"}'
        values: '0+992x600'
      - series: 'http_request_duration_seconds_count{route="/:code",status="500"}'
        values: '0+8x600'
    alert_rule_test:
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnCritical
        exp_alerts: []
      - eval_time: 500m
        alertname: RedirectAvailabilityBudgetBurnHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: redirect-availability
            exp_annotations:
              summary: "Redirect availability burning 6x — 5% of the 30d budget per 6h"
              description: "A steady trickle of server errors rather than an outage. Find the failing path before it becomes one."

  # ------------------------------------------------------------------
  # Process gone: no series at all, not even failures. The burn alerts
  # cannot fire (nothing to divide) — only the silence guard can.
  # ------------------------------------------------------------------
  - interval: 1m
    name: total silence trips the traffic guard
    input_series:
      - series: 'up{job="otel-collector-apps"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: RedirectTrafficAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: redirect-availability
            exp_annotations:
              summary: "No redirect requests recorded at all — service may be dead"
              description: "Not a single redirect request has been observed for 2 minutes, successful or failed. Either the process is down, the OTel pipeline is broken, or traffic genuinely stopped. All three are worth waking up for; a green dashboard here means nothing."
      - eval_time: 30m
        alertname: RedirectAvailabilityBudgetBurnCritical
        exp_alerts: []
