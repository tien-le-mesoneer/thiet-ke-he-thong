# SLO: 99% of redirects served in under 50 ms, over a 30-day window.
#
# The SLI is COUNTED, never interpolated: good/total taken from the histogram
# bucket whose boundary sits exactly on the threshold. See
# apps/url-shortener-node/src/otel.ts (LATENCY_BUCKETS_S) — deleting the 0.05
# boundary silently inflates the reported burn by ~2.5x.

groups:
  # ------------------------------------------------------------------
  # 1. The SLI, recorded at every window the burn-rate alerts need.
  # ------------------------------------------------------------------
  - name: slo_redirect_latency_sli
    interval: 30s
    rules:
      # Error ratio = fraction of successful redirects SLOWER than 50 ms.
      # Recorded rather than inlined so every alert below shares one definition
      # of "bad" — a burn-rate alert whose windows disagree about the SLI is
      # worse than no alert.
      - record: slo:redirect_latency_errors:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{route="/:code",status="302"}[5m]))
          )
      - record: slo:redirect_latency_errors:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{route="/:code",status="302"}[30m]))
          )
      - record: slo:redirect_latency_errors:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}[1h]))
            /
            sum(rate(http_request_duration_seconds_count{route="/:code",status="302"}[1h]))
          )
      - record: slo:redirect_latency_errors:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}[6h]))
            /
            sum(rate(http_request_duration_seconds_count{route="/:code",status="302"}[6h]))
          )
      - record: slo:redirect_latency_errors:ratio_rate3d
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{route="/:code",status="302",le="0.05"}[3d]))
            /
            sum(rate(http_request_duration_seconds_count{route="/:code",status="302"}[3d]))
          )

      # Convenience: burn rate = error ratio / (1 - SLO). 1.0 means the budget
      # is being spent exactly as fast as the 30-day window replenishes it.
      - record: slo:redirect_latency:burnrate1h
        expr: slo:redirect_latency_errors:ratio_rate1h / 0.01
      - record: slo:redirect_latency:burnrate6h
        expr: slo:redirect_latency_errors:ratio_rate6h / 0.01

  # ------------------------------------------------------------------
  # 2. Multi-window, multi-burn-rate alerts (Google SRE workbook).
  #
  # Each alert pairs a LONG window (is this real?) with a SHORT one (is it
  # still happening?). The long window rejects brief spikes; the short one
  # makes the alert stop firing promptly once things recover, instead of
  # smouldering for the length of the long window.
  # ------------------------------------------------------------------
  - name: slo_redirect_latency_burn
    interval: 30s
    rules:
      # 14.4x burn consumes 2% of a 30-day budget in 1 hour.
      - alert: RedirectLatencyBudgetBurnCritical
        expr: |
          slo:redirect_latency_errors:ratio_rate1h > (14.4 * 0.01)
          and
          slo:redirect_latency_errors:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          slo: redirect-latency
        annotations:
          summary: "Redirect latency budget burning 14.4x — 2% of the 30d budget per hour"
          description: >-
            More than 14.4% of successful redirects are slower than 50 ms over
            the last hour, and still are over the last 5 minutes. At this rate
            the entire 30-day error budget is gone in about 2 days.

      # 6x burn consumes 5% of the budget in 6 hours.
      - alert: RedirectLatencyBudgetBurnHigh
        expr: |
          slo:redirect_latency_errors:ratio_rate6h > (6 * 0.01)
          and
          slo:redirect_latency_errors:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
          slo: redirect-latency
        annotations:
          summary: "Redirect latency budget burning 6x — 5% of the 30d budget per 6h"
          description: >-
            Slower than the critical alert but well above sustainable. Worth
            looking at during working hours rather than at 3am.

      # 1x burn is exactly the sustainable rate; sustained, it exhausts the
      # budget precisely at the end of the window and leaves no room for a
      # real incident. A ticket, not a page.
      - alert: RedirectLatencyBudgetBurnSlow
        expr: |
          slo:redirect_latency_errors:ratio_rate3d > (1 * 0.01)
          and
          slo:redirect_latency_errors:ratio_rate6h > (1 * 0.01)
        for: 1h
        labels:
          severity: ticket
          slo: redirect-latency
        annotations:
          summary: "Redirect latency budget on track to fully exhaust in 30 days"
          description: >-
            No headroom left for an actual incident. Investigate before the
            next one arrives.

  # ------------------------------------------------------------------
  # 3. Guard: the SLI must exist.
  #
  # A latency SLI filtered to status="302" goes ABSENT, not bad, during a
  # total outage — every request 500s, so there are no successful redirects
  # to be slow. Without this the dashboards would look serenely green while
  # the service is down. This was the stopgap; the real fix is the
  # availability SLO in section 4 below, which counts 5xx against a
  # denominator that survives the outage. Kept because it is still the only
  # thing that notices traffic stopping entirely.
  # ------------------------------------------------------------------
  - name: slo_redirect_latency_meta
    interval: 30s
    rules:
      - alert: RedirectLatencySLIMissing
        expr: absent(slo:redirect_latency_errors:ratio_rate5m)
        for: 10m
        labels:
          severity: warning
          slo: redirect-latency
        annotations:
          summary: "Redirect latency SLI has no data — cannot tell healthy from dead"
          description: >-
            No successful redirects recorded for 10 minutes. Either traffic
            stopped or every request is failing. A latency SLO cannot
            distinguish the two; check availability.

  # ==================================================================
  # 4. AVAILABILITY SLO — 99.9% of redirect requests served without a
  #    server error, over a 30-day window. Budget: 0.1% = 43.2 min/30d.
  #
  # WHY THIS EXISTS, written down because the reasoning is the point:
  #
  # The 2026-08-30 game-day killed Redis under load. The service died, and
  # every alert in sections 1-2 stayed green for ~15 minutes. The latency
  # SLI filters status="302"; when every request fails there are no
  # successful redirects left to be slow, so the SLI does not go BAD, it
  # goes ABSENT — and an absent series satisfies no threshold.
  #
  # The fix is a denominator that survives the outage. This SLI counts 5xx
  # against ALL requests to the route, so a total failure reads 100% error
  # instead of vanishing.
  #
  # 404 IS NOT AN ERROR. An unknown short code is a correct answer, and a
  # crawler walking random codes must not burn the availability budget.
  # Only 5xx counts — the server failing at its job, not the client asking
  # for something that isn't there. (The same distinction bit us once
  # already: a k6 run measured 112k 404s as if they were successes.)
  # ==================================================================
  - name: slo_redirect_availability_sli
    interval: 30s
    rules:
      - record: slo:redirect_availability_errors:ratio_rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/:code",status=~"5.."}[5m]))
          /
          sum(rate(http_request_duration_seconds_count{route="/:code"}[5m]))
      - record: slo:redirect_availability_errors:ratio_rate30m
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/:code",status=~"5.."}[30m]))
          /
          sum(rate(http_request_duration_seconds_count{route="/:code"}[30m]))
      - record: slo:redirect_availability_errors:ratio_rate1h
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/:code",status=~"5.."}[1h]))
          /
          sum(rate(http_request_duration_seconds_count{route="/:code"}[1h]))
      - record: slo:redirect_availability_errors:ratio_rate6h
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/:code",status=~"5.."}[6h]))
          /
          sum(rate(http_request_duration_seconds_count{route="/:code"}[6h]))
      - record: slo:redirect_availability_errors:ratio_rate3d
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/:code",status=~"5.."}[3d]))
          /
          sum(rate(http_request_duration_seconds_count{route="/:code"}[3d]))

      - record: slo:redirect_availability:burnrate1h
        expr: slo:redirect_availability_errors:ratio_rate1h / 0.001
      - record: slo:redirect_availability:burnrate6h
        expr: slo:redirect_availability_errors:ratio_rate6h / 0.001

  # ------------------------------------------------------------------
  # 5. Availability burn alerts. Same multi-window structure as the
  #    latency alerts, but the budget is 10x tighter (0.001 not 0.01),
  #    so the absolute thresholds are 10x smaller.
  #
  #    `for:` is deliberately SHORTER than the latency equivalents. A slow
  #    redirect is an annoyance you can sit on for two minutes; a 5xx storm
  #    is the service being down, and the game-day showed 15 minutes of
  #    silence is how you find out too late.
  # ------------------------------------------------------------------
  - name: slo_redirect_availability_burn
    interval: 30s
    rules:
      # 14.4x burn consumes 2% of the 30-day budget in 1 hour.
      - alert: RedirectAvailabilityBudgetBurnCritical
        expr: |
          slo:redirect_availability_errors:ratio_rate1h > (14.4 * 0.001)
          and
          slo:redirect_availability_errors:ratio_rate5m > (14.4 * 0.001)
        for: 1m
        labels:
          severity: critical
          slo: redirect-availability
        annotations:
          summary: "Redirect availability burning 14.4x — 2% of the 30d budget per hour"
          description: >-
            More than 1.44% of redirect requests are returning 5xx over the
            last hour, and still are over the last 5 minutes. The 30-day
            budget is 43.2 minutes; at this rate it is gone in about 2 days.

      # 6x burn consumes 5% of the budget in 6 hours.
      - alert: RedirectAvailabilityBudgetBurnHigh
        expr: |
          slo:redirect_availability_errors:ratio_rate6h > (6 * 0.001)
          and
          slo:redirect_availability_errors:ratio_rate30m > (6 * 0.001)
        for: 10m
        labels:
          severity: warning
          slo: redirect-availability
        annotations:
          summary: "Redirect availability burning 6x — 5% of the 30d budget per 6h"
          description: >-
            A steady trickle of server errors rather than an outage. Find the
            failing path before it becomes one.

      - alert: RedirectAvailabilityBudgetBurnSlow
        expr: |
          slo:redirect_availability_errors:ratio_rate3d > (1 * 0.001)
          and
          slo:redirect_availability_errors:ratio_rate6h > (1 * 0.001)
        for: 1h
        labels:
          severity: ticket
          slo: redirect-availability
        annotations:
          summary: "Redirect availability on track to fully exhaust in 30 days"
          description: >-
            No headroom left for an actual incident. Investigate before the
            next one arrives.

  # ------------------------------------------------------------------
  # 6. Guard: the service is answering AT ALL.
  #
  # The availability SLI above survives "every request 5xx" but not "no
  # requests answered" — a crashed process exports no metrics, and after
  # Prometheus ages the series out (~5 min) there is nothing left to be
  # bad. This is the alert that fires when the process is simply gone.
  #
  # Unfiltered by status ON PURPOSE: a 5xx storm keeps this quiet (the
  # burn alert owns that case) and only genuine silence trips it.
  # ------------------------------------------------------------------
  - name: slo_redirect_availability_meta
    interval: 30s
    rules:
      - alert: RedirectTrafficAbsent
        expr: absent(sum(rate(http_request_duration_seconds_count{route="/:code"}[5m])))
        for: 2m
        labels:
          severity: critical
          slo: redirect-availability
        annotations:
          summary: "No redirect requests recorded at all — service may be dead"
          description: >-
            Not a single redirect request has been observed for 2 minutes,
            successful or failed. Either the process is down, the OTel
            pipeline is broken, or traffic genuinely stopped. All three are
            worth waking up for; a green dashboard here means nothing.
