# RabbitMQ 4.0 REMOVED the RABBITMQ_VM_MEMORY_HIGH_WATERMARK env var — setting
# it is a hard startup failure ("deprecated environment variables detected",
# exit 1), not a warning. Config file is the only supported route now.
#
# Absolute, not a ratio: Erlang does read the cgroup limit correctly (unlike
# the JVM and WiredTiger), but a ratio makes the flow-control threshold move
# whenever mem_limit changes, which is the opposite of a measurable spike.
vm_memory_high_watermark.absolute = 512MiB

# Block publishers when the disk gets tight rather than crashing.
disk_free_limit.absolute = 2GB
